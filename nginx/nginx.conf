events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limit: 10 request/giây/IP
    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;

    upstream user_service {
        server user-service:3001;
    }

    upstream customer_service {
        server customer-service:3002;
    }

    upstream product_service {
        server product-service:3003;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. USER-SERVICE
        # (USER-SERVICE) CUSTOMER SESSION API
        location /api/v1/customer-session/user-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cookie_path / /;
        }

        # (USER-SERVICE) ADMIN SESSION API
        location /api/v1/admin-session/user-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cookie_path / /;
        }
        
        # 2. CUSTOMER-SERVICE
        # (CUSTOMER-SERVICE) CUSTOMER SESSION API
        location /api/v1/customer-session/customer-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://customer_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # (CUSTOMER-SERVICE) ADMIN SESSION API
        location /api/v1/admin-session/customer-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://customer_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 3. PRODUCT-SERVICE
        # (PRODUCT-SERVICE) CUSTOMER SESSION API
        location /api/v1/customer-session/product-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}


