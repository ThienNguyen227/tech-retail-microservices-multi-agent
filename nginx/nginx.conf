events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker DNS Resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limit: 10 request/giây/IP
    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # 1. USER-SERVICE
        # CUSTOMER SESSION API
        location /api/v1/customer-session/user-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service user-service:3001;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cookie_path / /;
        }

        # ADMIN SESSION API
        location /api/v1/admin-session/user-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service user-service:3001;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cookie_path / /;
        }

        # 2. CUSTOMER-SERVICE

        # CUSTOMER SESSION API
        location /api/v1/customer-session/customer-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service customer-service:3002;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ADMIN SESSION API
        location /api/v1/admin-session/customer-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service customer-service:3002;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 3. PRODUCT-SERVICE
        # CUSTOMER SESSION API
        location /api/v1/customer-session/product-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service product-service:3003;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 4. CART-SERVICE
        # CUSTOMER SESSION API
        location /api/v1/customer-session/cart-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service cart-service:3004;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 5. BRANCH-SERVICE
        # CUSTOMER SESSION API
        location /api/v1/customer-session/branch-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service branch-service:3005;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 6. INVENTORY-SERVICE
        # CUSTOMER SESSION API
        location /api/v1/customer-session/inventory-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service inventory-service:3006;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 7. ORDER-SERVICE
        # CUSTOMER SESSION API
        location /api/v1/customer-session/order-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service order-service:3007;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 8. PROMOTION-SERVICE
        # CUSTOMER SESSION API
        location /api/v1/customer-session/promotion-service/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $service promotion-service:3008;
            proxy_pass http://$service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }                                                           
    }
}
