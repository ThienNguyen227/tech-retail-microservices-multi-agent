services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
  
  user-service-postgres:
    image: postgres:16
    container_name: user-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_service
    ports:
      - "5432:5432"
    volumes:
      - user_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service-migrate:
    build:
      context: ./backend/user-service
      target: migrate
    env_file:
      - ./backend/user-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@user-service-postgres:5432/user_service?schema=public
    depends_on:
      user-service-postgres:
        condition: service_healthy
    restart: "no"

  user-service:
    build:
      context: ./backend/user-service
      target: production
    container_name: user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/user-service/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:password@user-service-postgres:5432/user_service?schema=public
    depends_on:
      user-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3001, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  customer-service-postgres:
    image: postgres:16
    container_name: customer-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: customer_service
    ports:
      - "5433:5432"
    volumes:
      - customer_service_postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    ports:
    - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    
volumes:
  mongodb_data:
  user_service_postgres_data:
  customer_service_postgres_data:
